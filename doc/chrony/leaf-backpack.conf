# /etc/chrony/conf.d/backpack.conf  --  LEAF (rpi5-ubuntu .3, rpi5-silver-ubuntu .4)
#
# A leaf follows the master and nothing else. Deliberately NO `local` line: if the
# master is gone there is nothing to be consistent with, and being visibly
# unsynced is the correct, loud failure.

makestep 1 -1
maxslewrate 100
log tracking measurements statistics

# So the master (and the visualiser, once it is allowed) can query us.
allow 192.168.1.0/24
allow 192.168.2.0/24

# Command port. Wired address only -- see README trap 2.
bindcmdaddress <THIS_HOST_LAN_IP>
cmdallow 192.168.1.0/24
cmdallow 192.168.2.0/24
