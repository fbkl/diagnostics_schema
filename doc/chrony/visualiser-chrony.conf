# /etc/chrony/chrony.conf  --  VISUALISER (frkle-Predator-PT515-52, 192.168.2.39)
#
# SPECIAL CASE: this box runs chrony 3.2 (Ubuntu 18.04). `confdir` and
# `sourcedir` did not exist until chrony 4.0, so there is no /etc/chrony/conf.d
# or /etc/chrony/sources.d here and everything lives in this one file.
# `chronyc reload sources` also does not exist -- use `systemctl restart chrony`.
#
# It matters because it runs rviz and ar_track_alvar, so it publishes TFs into
# the same graph and its clock IS in every recording. tf2's buffer and rviz
# resolve "now" against the LOCAL clock, so a skewed visualiser gives
# extrapolation errors and silently starved message_filters, never a clear
# failure.
#
# It was deadlocked for weeks: the only SELECTABLE source was unreachable (the
# master allowed 192.168.1.0/24 and we arrive from 192.168.2.39) while the only
# REACHABLE sources were marked noselect. Result: never synchronised, Ref time
# 1970, and nothing said so. Fixed by `allow 192.168.2.0/24` on the master.

# Follow the rig clock, and only the rig clock.
server 192.168.1.5 iburst prefer minpoll 2 maxpoll 4
server frd-gsw.hvl.no  iburst noselect
server 128.39.103.52   iburst noselect

# No 'local' here: if the rig clock is gone there is nothing to be consistent
# with, and being visibly unsynced is the correct, loud failure.
makestep 1 -1
maxslewrate 100
maxchange 100 10 3
log tracking measurements statistics

allow 192.168.1.0/24
allow 192.168.2.0/24

bindcmdaddress 192.168.2.39
cmdallow 192.168.1.0/24
cmdallow 192.168.2.0/24
