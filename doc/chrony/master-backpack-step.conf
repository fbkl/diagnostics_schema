# /etc/chrony/conf.d/backpack-step.conf  --  ALL NODES, identical
#
# An unbounded step is dangerous mid-trial. Boot is exempt for the first 10
# updates (~40 s at minpoll 2); after that a >100 s jump is ignored, and three in
# a row kill chronyd LOUDLY instead of slewing quietly for days.
#
# chronyd exiting is the safe outcome: the clock free-runs at its last frequency
# instead of lurching. Nothing announces it, which is why host_alive.py carries a
# chronyd liveness check.
#
# systemd must NOT resurrect it, or the 10-update grace resets and the giant
# correction gets applied anyway. Verify: systemctl show chrony -p Restart
# should say Restart=no.

maxchange 100 10 3
