# /etc/chrony/conf.d/backpack.conf  --  MASTER (raspberrypi, 192.168.1.5)
#
# This machine is the rig's time root. Everything on 192.168.1.0/24 follows it
# and nothing else. Internal consistency beats absolute epoch: a trial where the
# hosts disagree is worthless, a trial 50 ms off UTC is fine.

allow 192.168.1.0/24
# the visualiser lives on the other side and needs its time from here too
allow 192.168.2.0/24

# Keep serving when the upstream path is gone -- the rig must not lose its
# reference just because eduroam dropped. NOT orphan: there is a designated
# master and no requirement to survive its failure (no master => no roscore =>
# no trial). See chrony.conf(5), "Isolated networks".
#
# Must match LOCAL_FALLBACK_STRATUM in pre_setup_diags.py. Change both together.
local stratum 5

# Boot: correct however big the jump. `1 -1` is NOT "stepping off" -- -1 is the
# LIMIT argument and means "no limit on how many updates may step". The stock
# `makestep 1 3` is what caused the original 15 h slew. The preflight disarms
# stepping before a recording (clock-hold) so nothing jumps mid-trial.
makestep 1 -1

# Sub-second corrections walk the WHOLE rig coherently, because everyone follows
# this clock. Cap the rate so it is invisible: 100 ppm = 0.01%, i.e. 0.25 us on a
# 2.5 ms IK period.
maxslewrate 100

# One line per clock update in /var/log/chrony/tracking.log. Column 9,
# "Rem. corr.", is the pending correction -- the field that would have caught the
# 15 h bug. This is the recording-validity record; copy the take's window into
# the run directory.
log tracking measurements statistics

# Command port (323), for `chronyc -h`. WIRED ADDRESS ONLY -- see README trap 2.
# The wifi address (192.168.2.221) was here and broke every time eduroam dropped,
# because chronyd binds once at startup and skips addresses that are not up.
bindcmdaddress 192.168.1.5
cmdallow 192.168.1.0/24
cmdallow 192.168.2.0/24
